# Firebase App Hosting — runtime config.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  concurrency: 80

# Public Firebase values are set per-environment (dev/staging/prod). Server-only
# secrets are stored in Cloud Secret Manager and referenced by name below.
env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://travispayne.com
    availability:
      - BUILD
      - RUNTIME

  # Server-only secrets (create with: firebase apphosting:secrets:set <name>)
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: firebase-service-account
  - variable: RECAPTCHA_SECRET_KEY
    secret: recaptcha-secret-key
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
  - variable: REVALIDATE_SECRET
    secret: revalidate-secret
  - variable: MUX_TOKEN_ID
    secret: mux-token-id
  - variable: MUX_TOKEN_SECRET
    secret: mux-token-secret
  - variable: MUX_SIGNING_KEY_ID
    secret: mux-signing-key-id
  - variable: MUX_SIGNING_PRIVATE_KEY
    secret: mux-signing-private-key
